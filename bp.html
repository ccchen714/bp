<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 關鍵：這一行可以讓網頁在手機上正常縮放，字體不會縮小 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日血壓記錄簿</title>
    <style>
        body { 
            font-family: sans-serif; 
            max-width: 500px; 
            margin: 20px auto; 
            padding: 0 15px; 
            line-height: 1.6; 
            /* 放大基礎字體，讓手機更好閱讀 */
            font-size: 18px; 
        }
        h2 { font-size: 26px; }
        h3 { font-size: 22px; margin-top: 30px; }
        
        /* 放大輸入框與標籤，方便手指點選 */
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { 
            padding: 10px; 
            width: 100%; 
            max-width: 200px; 
            font-size: 18px; 
            box-sizing: border-box;
        }
        
        /* 放大按鈕，更適合觸控 */
        button { 
            padding: 12px 20px; 
            margin-top: 10px;
            margin-right: 5px; 
            font-size: 16px;
            font-weight: bold;
            cursor: pointer; 
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .btn-save { background-color: #4CAF50; color: white; border: none; }
        .btn-danger { background-color: #ff4d4d; color: white; border: none; }
        
        /* 表格優化，在手機上不擁擠 */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 16px; }
        th, td { border: 1px solid #ccc; padding: 12px 8px; text-align: center; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h2>📊 每日血壓記錄簿</h2>
    
    <p><a href="index.html" style="font-size: 16px;">⬅ 回到網站首頁</a></p>

    <!-- 輸入介面 -->
    <div class="input-group">
        <label for="sys">收縮壓 (高壓):</label>
        <input type="number" id="sys" placeholder="例如 120"> mmHg
    </div>
    <div class="input-group">
        <label for="dia">舒張壓 (低壓):</label>
        <input type="number" id="dia" placeholder="例如 80"> mmHg
    </div>
    <button class="btn-save" onclick="saveData()">儲存紀錄</button>
    <button class="btn-danger" onclick="clearData()">清除所有紀錄</button>

    <!-- 歷史紀錄表格 -->
    <h3>📋 歷史紀錄</h3>
    <table>
        <thead>
            <tr>
                <th>時間</th>
                <th>高壓</th>
                <th>低壓</th>
            </tr>
        </thead>
        <tbody id="recordTable">
            <!-- 紀錄會動態顯示在這裡 -->
        </tbody>
    </table>

    <script>
        window.onload = function() {
            displayRecords();
        };

        function saveData() {
            const sysInput = document.getElementById('sys').value;
            const diaInput = document.getElementById('dia').value;

            if (!sysInput || !diaInput) {
                alert('請填入完整的收縮壓與舒張壓！');
                return;
            }

            const now = new Date();
            // 為了讓手機表格不塞爆，簡化時間格式顯示（只顯示 月/日 時:分）
            const timeString = `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            const newRecord = {
                time: timeString,
                sys: sysInput,
                dia: diaInput
            };

            let records = JSON.parse(localStorage.getItem('bpRecords')) || [];
            records.unshift(newRecord);
            localStorage.setItem('bpRecords', JSON.stringify(records));

            document.getElementById('sys').value = '';
            document.getElementById('dia').value = '';
            displayRecords();
        }

        function displayRecords() {
            const records = JSON.parse(localStorage.getItem('bpRecords')) || [];
            const tbody = document.getElementById('recordTable');
            tbody.innerHTML = ''; 

            records.forEach(function(item) {
                const row = `<tr>
                    <td>${item.time}</td>
                    <td><strong>${item.sys}</strong></td>
                    <td><strong>${item.dia}</strong></td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function clearData() {
            if (confirm('確定要刪除所有血壓紀錄嗎？')) {
                localStorage.removeItem('bpRecords');
                displayRecords();
            }
        }
    </script>
</body>
</html>
