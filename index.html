<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>每日血壓記錄簿</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 0 10px; line-height: 1.6; }
        .input-group { margin-bottom: 10px; }
        label { display: inline-block; width: 100px; }
        input { padding: 5px; width: 100px; }
        button { padding: 5px 15px; margin-right: 5px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
        .btn-danger { background-color: #ff4d4d; color: white; border: none; }
    </style>
</head>
<body>

    <h2>📊 每日血壓記錄簿</h2>
    
    <!-- 回到首頁的導覽連結 -->
    <p><a href="index.html">⬅ 回到網站首頁</a></p>

    <!-- 輸入介面 -->
    <div class="input-group">
        <label for="sys">收縮壓 (高壓):</label>
        <input type="number" id="sys" placeholder="例如 120"> mmHg
    </div>
    <div class="input-group">
        <label for="dia">舒張壓 (低壓):</label>
        <input type="number" id="dia" placeholder="例如 80"> mmHg
    </div>
    <button onclick="saveData()">儲存紀錄</button>
    <button class="btn-danger" onclick="clearData()">清除所有紀錄</button>

    <!-- 歷史紀錄表格 -->
    <h3>📋 歷史紀錄 (儲存於本機瀏覽器)</h3>
    <table>
        <thead>
            <tr>
                <th>時間</th>
                <th>收縮壓 (高壓)</th>
                <th>舒張壓 (低壓)</th>
            </tr>
        </thead>
        <tbody id="recordTable">
            <!-- 紀錄會動態顯示在這裡 -->
        </tbody>
    </table>

    <script>
        // 頁面載入時，自動讀取並顯示舊資料
        window.onload = function() {
            displayRecords();
        };

        // 儲存資料的函式
        function saveData() {
            const sysInput = document.getElementById('sys').value;
            const diaInput = document.getElementById('dia').value;

            if (!sysInput || !diaInput) {
                alert('請填入完整的收縮壓與舒張壓！');
                return;
            }

            // 取得現在時間
            const now = new Date();
            const timeString = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            // 建立一筆新物件
            const newRecord = {
                time: timeString,
                sys: sysInput,
                dia: diaInput
            };

            // 從 LocalStorage 撈出舊陣列，若沒有就建立新陣列
            let records = JSON.parse(localStorage.getItem('bpRecords')) || [];
            
            // 把新紀錄推入陣列頂端（最新顯示在最前面）
            records.unshift(newRecord);

            // 存回 LocalStorage
            localStorage.setItem('bpRecords', JSON.stringify(records));

            // 清空輸入框並重新整理表格
            document.getElementById('sys').value = '';
            document.getElementById('dia').value = '';
            displayRecords();
        }

        // 顯示資料的函式
        function displayRecords() {
            const records = JSON.parse(localStorage.getItem('bpRecords')) || [];
            const tbody = document.getElementById('recordTable');
            tbody.innerHTML = ''; // 先清空表格

            records.forEach(function(item) {
                const row = `<tr>
                    <td>${item.time}</td>
                    <td>${item.sys} mmHg</td>
                    <td>${item.dia} mmHg</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        // 清除所有資料的函式
        function clearData() {
            if (confirm('確定要刪除所有血壓紀錄嗎？此操作無法復原。')) {
                localStorage.removeItem('bpRecords');
                displayRecords();
            }
        }
    </script>
</body>
</html>
